version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: dbml
    main: ./cmd/dbml
    binary: dbml
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, typst/dbml.typ]

release:
  # The Typst plugin (built with TinyGo in CI) ships as a release asset.
  extra_files:
    - glob: typst/dbml.wasm

checksum:
  name_template: checksums.txt
